<script>
/* ===== UI ===== */
let game, rs, sel = new Set(), staged = [], hintIds = new Set(), hintText = '', notice = null, feed = [], modal = null, aiBusy = false;
let gen = 0, hintTarget = null, warned3 = -1;
const ORDER = NAT.concat(['2','JK']);
const esc = s => String(s).replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[ch]);
const fmt = n => (n < 0 ? '−' : (n > 0 ? '+' : '')) + Math.abs(n).toLocaleString();

let screen = 'home';
function startGame(){ gen++; stopVoice(); screen = 'game'; game = newGame(); feed = []; nextRound(); }
function goHome(){ gen++; stopVoice(); aiBusy = false; modal = null; screen = 'home'; render(); }
function continueGame(){
  screen = 'game'; modal = null;
  if (rs && rs.ended){ modal = 'round'; render(); } else if (rs && rs.pendingAsk){ modal = 'ask'; render(); } else { render(); loop(); }
}
function playFromHome(){ if (game && !game.over) continueGame(); else startGame(); }
function nextRound(){
  gen++; stopVoice(); rs = newRound(game); rs.interactive = true; askArmed = false; caption = null; shownSeat = rs.current; hlTurn = -1; resetHandOrder(); sel.clear(); staged = []; hintIds.clear(); hintText = ''; hintTarget = null; notice = null; modal = null;
  addFeed(rs.log[0]); render(); loop();
}
/* ===== VOICE: reads actions aloud with the browser's speech engine ===== */
let voiceOn = true;
const SUITW = {'♠':'spades', '♥':'hearts', '♦':'diamonds', '♣':'clubs'}, RANKW = {A:'Ace', K:'King', Q:'Queen', J:'Jack', 2:'Two', 3:'Three', 4:'Four', 5:'Five', 6:'Six', 7:'Seven', 8:'Eight', 9:'Nine', 10:'Ten'}, PLURW = {2:'twos', 3:'threes', 4:'fours', 5:'fives', 6:'sixes', 7:'sevens', 8:'eights', 9:'nines', 10:'tens'};
const canSpeak = () => typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';
function spoken(t){
  return String(t).replace(/\b(10|[2-9AKQJ])([♠♥♦♣])/g, (m, r, s) => (RANKW[r] || r) + ' of ' + SUITW[s])
    .replace(/\b(10|[2-9])s\b/g, (m, r) => PLURW[r]).replace(/\s*\(now (\d+) cards\)/g, ', now $1 cards').replace(/−/g, 'minus ').replace(/&/g, 'and').replace(/\(partner\)/g, '').replace(/\s+/g, ' ');
}
let voiceName = '', voiceRate = 0.8;
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy/i;
function voiceScore(v){
  let s = 0; const n = v.name + ' ' + (v.voiceURI || '');
  if (/Natural|Neural|Online/i.test(n)) s += 100;
  if (/Premium|Enhanced|Siri/i.test(n)) s += 90;
  if (/Google/i.test(n)) s += 60;
  if (/Samantha|Ava|Allison|Susan|Zoe|Evan|Nathan|Daniel|Karen|Moira|Serena|Aria|Jenny|Guy|Libby|Sonia/i.test(n)) s += 50;
  if (/en[-_]US/i.test(v.lang)) s += 10;
  return s;
}
function goodVoices(){
  if (!canSpeak()) return [];
  try { return speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang) && !NOVELTY.test(v.name)).sort((a, b) => voiceScore(b) - voiceScore(a)).slice(0, 3); } catch (e) { return []; }
}
/* We count our own utterances instead of trusting speechSynthesis.speaking, which many voices report too early. */
let speechBusy = 0, speechGen = 0, speechEnd = 0;
function speak(t, interrupt){
  if (!voiceOn || !canSpeak() || !t) return;
  try {
    if (interrupt){ speechSynthesis.cancel(); speechGen++; speechBusy = 0; speechEnd = 0; }
    const text = spoken(t), u = new SpeechSynthesisUtterance(text); u.rate = voiceRate;
    const vs = goodVoices(), v = vs.find(x => x.name === voiceName) || vs[0]; if (v){ u.voice = v; u.lang = v.lang; }
    const gen0 = speechGen; let finished = false;
    const done = () => { if (finished) return; finished = true; if (gen0 === speechGen) speechBusy = Math.max(0, speechBusy - 1); };
    u.onend = done; u.onerror = done; speechBusy++;
    const now = Date.now(); speechEnd = Math.max(now, speechEnd) + text.length * 95 / Math.max(0.4, voiceRate) + 800;   // safety net if the browser never reports the end
    setTimeout(done, speechEnd - now + 1500);
    speechSynthesis.speak(u);
  } catch (e) {}
}
/* ===== SETTINGS (saved in the browser when it allows) ===== */
const SPEEDS = {slow:['Slow', 3200], relaxed:['Relaxed', 2000], normal:['Normal', 1000], fast:['Fast', 450]};
const LEVELS = {beginner:['Beginner', 'West and East play carelessly: they skip melds, rarely take the pack and toss cards that help you.'],
  intermediate:['Intermediate', 'West and East play a decent game with the occasional slip.'],
  advanced:['Advanced', 'West and East play their best: they block what you need and take every chance to meld or go out.']};
let speedKey = 'relaxed', levelKey = 'beginner', musicVol = 0.5, musicStyle = 'bouncy';
const aiDelay = () => SPEEDS[speedKey][1];
let nameDraft = 'Player';
function saveName(){
  const el = document.getElementById('pname'), v = (el ? el.value : nameDraft).trim().slice(0, 20);
  if (!v){ const m = document.getElementById('namemsg'); if (m) m.textContent = 'Please type a name first.'; return; }
  playerName = nameDraft = v; saveSettings();
  const m = document.getElementById('namemsg'); if (m) m.textContent = 'Saved as ' + v;
  const sc = document.getElementById('plname'); if (sc) sc.textContent = v;
}
function saveSettings(){ try { localStorage.setItem('canastaSettings', JSON.stringify({speedKey, levelKey, musicVol, musicStyle, voiceOn, voiceName, voiceRate, playerName})); } catch (e) {} }
function loadSettings(){
  try {
    const s = JSON.parse(localStorage.getItem('canastaSettings') || 'null'); if (!s) return;
    if (SPEEDS[s.speedKey]) speedKey = s.speedKey; if (LEVELS[s.levelKey]) levelKey = s.levelKey;
    if (s.musicStyle && typeof s.musicStyle === 'string' && s.musicStyle in MUSIC) musicStyle = s.musicStyle;
    if (typeof s.musicVol === 'number') musicVol = Math.min(1, Math.max(0, s.musicVol));
